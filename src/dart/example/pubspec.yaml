name: meridian_example
description: Minimal example app for the flash_webrtc package.
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flash_webrtc:
    path: ..
  flutter_webrtc: ^0.12.0
  uuid: ^4.0.0
  # Task 6 (?mediaSrc= web uplink): MediaStreamWeb (dart_webrtc) wraps the
  # <video>.captureStream() MediaStream (web) that the example feeds the
  # node as its initialize() uplink.
  dart_webrtc: ^1.8.0
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true