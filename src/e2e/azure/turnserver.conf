# FLASH e2e TURN server (Task 10, geo suite). Authoritative copy: applied to
# the lab VM by provision.sh/cloud-init.yaml (and installed live over SSH on
# the first estate, see the README's "TURN forced-relay" section).
# Long-term credentials (matches the demo's ?turn=url,username,credential
# affordance and turn.spec.ts): realm flash.test, user flash.
listening-port=3478
# The VM's only public address; relay allocations advertise it (the NIC's
# private address would be unreachable from the orchestrator/netns peers).
# __TURN_EXTERNAL_IP__ is substituted by provision.sh (lab VM public IP).
external-ip=__TURN_EXTERNAL_IP__
# Relay port range per plan (the NSG's allow-ice-udp rule already opens
# inbound UDP 1024-65535, which covers it).
min-port=49152
max-port=65535
realm=flash.test
lt-cred-mech
user=flash:flash-e2e-cred
# Plain STUN/TURN over UDP/TCP only for the e2e rig; no certificates needed.
no-tls
no-dtls
# No CLI/control socket, no multicast relays; keep the default syslog
# logging (journalctl -u coturn is the failure playbook's evidence source).
no-cli
no-multicast-peers
no-loopback-peers